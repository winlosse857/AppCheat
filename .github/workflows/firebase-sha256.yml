name: Get Firebase SHA-256

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/firebase-sha256.yml'

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0.2'

      - name: Prepare persistent Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing GitHub secret ANDROID_DEBUG_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexo-debug.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/nexo-debug.keystore" >> "$GITHUB_ENV"

      - name: Generate debug signing fingerprint
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:signingReport | tee signing-report.txt
          echo "---- SHA-256 fingerprints ----"
          awk '/Variant: debug$/{show=1} show && /SHA-256:/{print; found=1; exit} /^----------$/{show=0} END{if (!found) exit 1}' signing-report.txt
