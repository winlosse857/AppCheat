name: Get Firebase SHA-256

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/firebase-sha256.yml'

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'

      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.config/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.config/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias AndroidDebugKey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Generate debug signing fingerprint
        run: |
          gradle --no-daemon :app:signingReport | tee signing-report.txt
          echo "---- SHA-256 fingerprints ----"
          awk '/Variant: debug$/{show=1} show && /SHA-256:/{print; found=1; exit} /^----------$/{show=0} END{if (!found) exit 1}' signing-report.txt
