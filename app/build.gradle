plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rocket.esp'
    compileSdk 34

    signingConfigs {
        nexoDebug {
            storeFile file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "${rootDir}/nexo-debug.keystore")
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias System.getenv("ANDROID_KEY_ALIAS")
            keyPassword System.getenv("ANDROID_KEY_PASSWORD")
        }
    }

    defaultConfig {
        applicationId "com.rocket.esp"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.nexoDebug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
